h1{font-size:clamp(28px,4vw,40px);line-height:1.3;margin:0 0 10px}h2{font-size:23px;margin:38px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line)}h3{font-size:18px}p{margin:10px 0 16px}.desc{color:var(--muted);font-size:17px}li{margin:7px 0}table{border-collapse:collapse;width:100%;margin:18px 0;display:block;overflow-x:auto}td,th{border:1px solid var(--line);padding:10px 13px;text-align:left;min-width:100px}th{background:#edf4ee;color:#315844}tr:nth-child(even) td{background:#fafcf9}.note{background:#edf6ef;border-left:4px solid var(--green);padding:15px 18px;margin:20px 0;border-radius:0 9px 9px 0}.warn{background:#fbf5e9;border-color:#c58b28}.formula{background:#172b23;color:#e2f1e7;padding:16px;text-align:center;border-radius:9px;font-family:monospace;margin:18px 0}.footer{border-top:1px solid var(--line);margin-top:45px;padding-top:15px;color:#87938b;font-size:12px}

</style></head><body><header class="top"><div class="brand">FICSIT / FIELD MANUAL<small>幸福工厂完全攻略百科 · 正式内容版 V1.0</small></div><div><a style="color:#dbe9df" href="#" onclick="print();return false">打印 / PDF</a></div></header><div class="layout"><aside class="side"><h4>百科目录 / CONTENTS</h4><input class="search" id="search" placeholder="搜索章节…" type="search"><nav class="nav" id="nav"></nav></aside><main><div id="crumb" style="font-size:11px;letter-spacing:.15em;color:#89968e;margin-bottom:20px">FICSIT FIELD MANUAL</div><article id="article"></article><div class="footer">《幸福工厂完全攻略百科》· 正式内容版 V1.0 · 版本基准 1.2.5.0 · 核验日期 2026-11-08</div></main></div><script>const PAGES=[{"id": "p0", "title": "总览与阅读指南", "group": "开始使用", "desc": "游戏核心循环、版本基准与百科使用方法", "body": "<h2>本百科的目标</h2><p>《幸福工厂》是一款围绕资源提取、加工转换、物流运输、能源供给与空间组织展开的自动化建造游戏。本百科从机制出发，解释生产线为什么能运行、为什么会堵塞，以及怎样扩张而不让工厂失控。</p><h2>核心循环</h2><ol><li>勘探资源节点与地形。</li><li>使用矿机、抽取器获得原料。</li><li>按配方配置加工建筑。</li><li>用传送带、管道、车辆、铁路和无人机运输。</li><li>提供稳定电力并管理副产品。</li><li>推进 HUB、MAM 与太空电梯解锁。</li></ol><div class='note'><b>版本基准：</b>本版以 v1.2.5.0（Build 517554）为基准，核验日期 2026-11-08。具体配方和数值仍应以当前游戏数据为准。</div><h2>阅读方式</h2><p>按新手发展路线顺序阅读，或使用左侧搜索定位主题。每条生产线都应明确输入、输出、每分钟速率、功耗和物流限制。理论产能不等于实际到货量。</p>"}, {"id": "p1", "title": "新手发展路线", "group": "开始使用", "desc": "开局选址、HUB 升级、第一座工厂与煤电过渡", "body": "<h2>开局选址</h2><p>起始区域不会永久限制发展。选择时优先考虑铁、铜、石灰石的距离，平坦建造空间，煤与水源的可达性，以及后续石油运输路线。</p><h2>推荐推进顺序</h2><ol><li>完成 HUB 初始升级，解锁基础建造、矿机与传送带。</li><li>建立铁、铜、石灰石自动化，不要长期依赖手工制作。</li><li>完成 Tier 1、Tier 2，逐步解锁物流与钢铁。</li><li>建立固体生物燃料链，减少手动补燃料。</li><li>尽早推进煤电，完成从人工维护能源到自动供电的转变。</li><li>建造太空电梯，逐步完成项目装配以解锁更高 Tier。</li></ol><h2>第一座工厂</h2><p>建议按生产链分区：矿区、冶炼区、基础零件区、仓储区和配电区。初期优先清晰与可扩展，不必追求极限紧凑。为升级后的传送带、机器和检修通道预留空间。</p><h2>何时扩建</h2><p>上游堆料、下游缺料，先检查物流；上游机器空转且库存不足，检查配方总消耗；电网接近上限，先扩大发电或做负载管理。只有瓶颈确实在加工机器时才增加机器。</p>"}, {"id": "p2", "title": "里程碑、Tier 与太空电梯", "group": "进度与研究", "desc": "HUB、阶段解锁、项目零件与推进策略", "body": "<h2>里程碑系统</h2><p>里程碑解锁建筑、装备、物流与生产能力。部分早期升级通过 HUB 完成；Tier 3 及更高阶段需要建造太空电梯后继续推进。</p><h2>太空电梯</h2><p>太空电梯承接项目装配零件。零件可手动提交，也可由传送带输入。装入的零件不能直接从界面取回；拆除太空电梯会返还装载物。太空电梯可迁移，项目进度不会因此丢失。</p><h2>项目推进方法</h2><ol><li>确认当前阶段所需项目零件与数量。</li><li>反向拆解各零件的上游生产链。</li><li>识别共享材料与稀缺资源。</li><li>先建立基础零件稳定产能，再增加项目专线。</li><li>每次阶段提交后，重新检查新解锁的配方与建筑。</li></ol><p>把一次性解锁需求与长期生产需求分开，避免为少量提交物品建设过度庞大的专线。</p>"}, {"id": "p3", "title": "生产系统与产能计算", "group": "工厂设计", "desc": "配方换算、机器数量、时钟速度、瓶颈与模块化", "body": "<h2>配方换算</h2><p>规划生产线时统一使用每分钟。若每周期产出 x 件、周期 t 秒，单机理论产量为 x × 60 ÷ t 件/分钟。</p><div class='formula'>单机产量 = 每周期产出 × 60 ÷ 周期秒数</div><h2>机器数量</h2><div class='formula'>所需机器数 = 目标总产量 ÷ 单机产量</div><p>结果不是整数时，可调整时钟速度，或使用多台机器分担。选择应考虑功耗、占地、供料方式和维护便利性。</p><h2>示例：标准铁板</h2><p>标准铁板配方：建造机每 6 秒消耗 3 铁锭并产出 2 铁板。换算为每分钟，单机消耗 30 铁锭，产出 20 铁板。目标 60 铁板/分钟，需要 3 台 100% 建造机，并供应 90 铁锭/分钟。</p><table><tr><th>目标铁板</th><th>等效建造机</th><th>铁锭需求</th></tr><tr><td>20/min</td><td>1 台</td><td>30/min</td></tr><tr><td>40/min</td><td>2 台</td><td>60/min</td></tr><tr><td>60/min</td><td>3 台</td><td>90/min</td></tr><tr><td>50/min</td><td>2.5 台等效产能</td><td>75/min</td></tr></table><h2>时钟速度与功耗</h2><p>常见生产建筑的产量与时钟速度线性相关，功耗通常按时钟倍率的 1.6 次方变化。200% 时钟速度产量翻倍，但功耗约为 3.03 倍，而不是 2 倍。发电机、抽取器等需分别核对各自机制。</p><div class='note warn'><b>常见误区：</b>不要用“产能翻倍＝耗电翻倍”估算电网。</div><h2>瓶颈分析</h2><ol><li>观察最终产品是否达到目标速率。</li><li>检查末端机器是否缺料停机。</li><li>沿生产链向上游找第一个供给不足节点。</li><li>检查供给、带宽、机器时钟、流体和供电。</li><li>只扩建真正限制总产量的环节。</li></ol><h2>模块化</h2><p>为模块定义输入、输出和功率需求；统一地基尺寸与接口高度；预留配电和检修空间；复制蓝图前核对配方、时钟速度与物流接口。</p>"}, {"id": "p4", "title": "建筑与设备分类", "group": "工厂设计", "desc": "提取、加工、物流、能源、组织与辅助设施", "body": "<table><tr><th>类别</th><th>代表建筑</th><th>职责</th></tr><tr><td>资源提取</td><td>矿机、油井抽取器、水泵、资源井抽取器</td><td>将地图资源转为输入</td></tr><tr><td>基础加工</td><td>熔炉、铸造厂、建造机、组装机</td><td>冶炼与基础零件</td></tr><tr><td>复杂加工</td><td>制造机、精炼厂、搅拌器、混合器、量子编码器</td><td>多输入、流体与高阶配方</td></tr><tr><td>物流</td><td>传送带、管道、卡车站、火车站、无人机港</td><td>连接生产环节</td></tr><tr><td>能源</td><td>生物质燃烧器、煤电、燃油、核电、地热</td><td>持续供电</td></tr><tr><td>辅助</td><td>储存箱、蓝图设计师、回收机、MAM</td><td>存储、复制、回收、研究</td></tr></table><h2>建筑选型</h2><p>除配方外，还要考虑建筑输入输出接口、占地、功耗、流体需求、副产品和当地资源。相同产品可能有多条路线，最优方案取决于资源位置、运输距离、能源与维护成本。</p><h2>蓝图设计师</h2><p>蓝图适合复制标准生产模块、物流接口和配电结构，但不是自动优化器。复制前仍需检查资源节点、输入方向、管道高度、配方、时钟速度和供电。</p>"}, {"id": "p5", "title": "资源节点与采集", "group": "资源与探索", "desc": "纯度、矿机等级、开采速率与资源规划", "body": "<h2>资源纯度</h2><p>固体资源节点分为贫瘠、普通、纯净。同等级矿机同一时钟速度下，产量比例为 0.5 : 1 : 2。</p><table><tr><th>矿机</th><th>贫瘠</th><th>普通</th><th>纯净</th></tr><tr><td>Mk.1</td><td>30/min</td><td>60/min</td><td>120/min</td></tr><tr><td>Mk.2</td><td>60/min</td><td>120/min</td><td>240/min</td></tr><tr><td>Mk.3</td><td>120/min</td><td>240/min</td><td>480/min</td></tr></table><p>以上为 100% 时钟速度基准。公式：纯度倍率 × 时钟倍率 × 矿机基础速率。实际输出还受传送带吞吐量限制。</p><h2>矿机等级</h2><p>Mk.1、Mk.2、Mk.3 基础速率分别为 60、120、240 件/分钟。升级矿机时必须检查出口传送带能否运走产出。矿机通电后存在启动时间，短时间观察不等于稳定产量。</p><h2>资源规划步骤</h2><ol><li>确定目标产品和配方路线。</li><li>反算原矿需求，核对节点纯度。</li><li>选择矿机等级与时钟速度。</li><li>检查矿机出口带宽。</li><li>规划矿区供电、运输距离与扩建空间。</li></ol><p>资源节点不会像可消耗矿脉那样被挖空。长期规划重点在位置、纯度、开采速率、物流和供电。</p>"}, {"id": "p6", "title": "物流：传送带与分流系统", "group": "物流系统", "desc": "传送带等级、分流器、合流器、歧管与缓存", "body": "<h2>传送带吞吐量</h2><table><tr><th>等级</th><th>最大吞吐量</th></tr><tr><td>Mk.1</td><td>60 件/min</td></tr><tr><td>Mk.2</td><td>120 件/min</td></tr><tr><td>Mk.3</td><td>270 件/min</td></tr><tr><td>Mk.4</td><td>480 件/min</td></tr><tr><td>Mk.5</td><td>780 件/min</td></tr><tr><td>Mk.6</td><td>1200 件/min</td></tr></table><div class='note warn'><b>带宽限制：</b>分流器和合流器不会增加总吞吐量。一条 Mk.5 带最多承载 780 件/分钟，超出的理论产量无法通过该段传送带。</div><h2>分流器与合流器</h2><p>分流器把输入分配到多个出口，合流器把多个输入汇入一个出口。下游堵塞、出口优先级和合流竞争会影响实际分配。智能分流器适合多产品共用主干线，但要为溢出物设计明确去向。</p><h2>均衡器与歧管</h2><p>均衡器通过多级分流/合流使支线流量趋于均匀，结构复杂但适合同步供料。歧管用主干带依次给多台机器供料，结构简单、扩展方便；启动初期需要时间填满机器输入缓存。</p><h2>缓存</h2><p>储存箱能缓冲短时波动，不能解决长期产能不足。上游持续小于下游消耗，缓存最终会空；上游持续大于下游消耗，缓存最终会满。</p>"}, {"id": "p7", "title": "流体：管道、扬程与缓冲", "group": "物流系统", "desc": "管道容量、流体波动、泵与阀门", "body": "<h2>流体与固体物流的差异</h2><p>管道运输连续流体，流体会在管网中波动。管道标称容量是上限，不代表任意布局都能持续达到该流量。储罐、泵、阀门、高度差和支路竞争都会影响实际供给。</p><h2>管道等级</h2><p>Mk.1 标称最大流量 300 m³/min，Mk.2 标称最大流量 600 m³/min。复杂管网可能因连接方式、波动和多支路竞争达不到理论值。</p><h2>扬程与泵</h2><p>液体不能自动无限向高处流动。建筑本身具有基础扬程，超过后需要管道泵。泵的箭头表示允许流动方向，应安装在解决扬程不足的位置，而非沿线无意义堆叠。</p><h2>阀门</h2><p>阀门用于限制流量或阻止反向流动，不会创造压力。设置过低可能成为瓶颈，流量分配要结合输入、输出和储罐液位观察。</p><h2>排错步骤</h2><ol><li>确认上游实际产量。</li><li>确认管道等级和连接方向。</li><li>检查高点扬程，必要时加泵。</li><li>检查支路是否竞争同一段容量。</li><li>观察储罐液位，区分供给不足与波动。</li></ol>"}, {"id": "p8", "title": "电力系统与能源规划", "group": "能源系统", "desc": "生物质、煤电、燃油、核能、储能与跳闸", "body": "<h2>单位</h2><p>功率用 MW 表示，储能容量用 MWh 表示，燃料能量密度用 MJ 表示。MW 是供电/耗电速率，MWh 是能量容量，不能混用。</p><table><tr><th>能源方式</th><th>输入</th><th>优势与限制</th></tr><tr><td>生物质</td><td>树叶、木材、生物质燃料</td><td>开局易建；依赖人工采集与补充</td></tr><tr><td>煤电</td><td>煤、水</td><td>第一套自动化持续电力；需同时规划水和煤</td></tr><tr><td>燃油</td><td>燃油及后续燃料</td><td>功率密度高；化工链复杂且副产品需处理</td></tr><tr><td>地热</td><td>地图地热点</td><td>无需燃料；位置固定且输出依地点特性变化</td></tr><tr><td>核电</td><td>核燃料、水</td><td>单机功率高；废料与辐射管理复杂</td></tr></table><h2>煤电配置</h2><p>同时核算煤供给、水泵产量、管道流量、发电机数量与电力需求。水泵、矿机和生产建筑本身也耗电，应预留启动与运行余量。</p><h2>电网跳闸</h2><p>当需求超过可用供电且储能耗尽，断路器会跳闸，电网停机直至问题修复并手动复位。建议将关键生产区与非关键区分组，便于故障隔离。</p><h2>储能与核废料</h2><p>储能适合应对短时波动，不能长期替代发电能力。核电需预先设计燃料棒、水、废料储存或再处理路线；不要在没有处理方案时启动大规模核电。</p>"}, {"id": "p9", "title": "探索、MAM 与硬盘", "group": "资源与探索", "desc": "研究树、坠毁舱、替代配方与特殊收集物", "body": "<h2>MAM</h2><p>MAM（分子分析机）研究探索获得的材料与特殊物品，解锁额外建筑、装备、配方和功能。它与 HUB 里程碑并行推进。发现新材料后应检查是否出现可研究项目。</p><h2>硬盘与替代配方</h2><p>硬盘通常从坠毁舱获得，放入 MAM 分析后可从符合条件的候选替代配方中选择。替代配方不一定全面更优：有的节省原矿，有的减少机器数量，有的只是把瓶颈转移到另一种资源。</p><h2>评估替代配方</h2><ol><li>比较最终产量。</li><li>比较整条链的原矿消耗。</li><li>比较建筑数量、功耗与流体需求。</li><li>比较当地资源可获得性与运输距离。</li><li>纳入副产品处理成本。</li></ol><h2>坠毁舱</h2><p>坠毁舱可能要求电力或指定物品才能开启。出发前准备常见零件、便携式矿机、燃料与防护装备。官方 Wiki 记录地图中有 118 个硬盘坠毁点，具体开启要求因地点而异。</p><h2>外星收集物</h2><p>电力蛞蝓、Somersloop、Mercer Sphere、SAM 等对象用于研究、生产增幅或高级科技。它们往往是有限地图资源，使用前先确认科技路径与后期需求。</p>"}, {"id": "p10", "title": "车辆、铁路与无人机", "group": "物流系统", "desc": "卡车路径、火车信号、货运站台与无人机", "body": "<h2>地面车辆</h2><p>卡车与拖拉机适合中短距离固体运输。通过车辆站装卸资源并记录自动驾驶路径。车辆路径对地形、道路连续性和站点位置敏感，故障时先检查路径节点、坡度、交叉口与站点对齐。</p><h2>铁路</h2><p>铁路适合跨区域高吞吐运输。建设前规划线路、站点、轨道方向和回路结构。区块信号把轨道划分为占用区块，路径信号用于复杂交汇并预约通行路径。初学者宜先用简单单向环线或双轨结构。</p><h2>货运站台</h2><p>实际吞吐由站台装卸速度、列车编组、停站时间、线路冲突和传送带等级共同决定。不能因为站台连接了高等级传送带，就假设列车能无限快速装卸。</p><h2>无人机</h2><p>无人机适合高价值、低到中等流量、跨越复杂地形的远距离运输。它依赖无人机港与电池供应链。规划时核算往返航程、吞吐量和电池消耗，而不只看地图直线距离。</p>"}, {"id": "p11", "title": "石油、燃油与化工链", "group": "复杂生产链", "desc": "原油提炼、塑料橡胶、燃料与副产品", "body": "<h2>石油链的特点</h2><p>石油生产链连接流体加工、固体副产品和发电。原油经精炼可得到塑料、橡胶、燃油及副产品。替代配方会改变产物比例，规划时必须先决定主产品，再安排副产品去向。</p><h2>副产品管理</h2><p>副产品无法持续排出时，精炼厂可能因输出堵塞而停机，阻断主产品。处理方式包括转化为其他物品、用于发电或进入后续工艺。临时存入储罐不等于解决长期问题。</p><h2>燃油发电</h2><p>同时核算燃料生产、运输、发电机数量、燃料消耗、副产品处理和电厂自身功耗。高能量密度燃料能降低运输量，但生产链更复杂。</p><h2>设计步骤</h2><ol><li>确定原油输入与目标产品比例。</li><li>选定配方并比较副产品。</li><li>设计副产品稳定消耗路径。</li><li>核对管道流量和缓冲。</li><li>按实际燃料产量配置发电机。</li></ol>"}, {"id": "p12", "title": "核能与放射性管理", "group": "复杂生产链", "desc": "燃料棒、核电站、废料与处理闭环", "body": "<h2>核能的收益与代价</h2><p>核电站单机输出高，适合后期大规模供电；代价是燃料链复杂、需要稳定供水，并产生放射性废料。核能项目应先完成全链条设计，再投入运行。</p><h2>启动前必须回答</h2><ul><li>燃料棒每分钟产量是多少？</li><li>每台核电站燃料消耗和用水量是多少？</li><li>废料每分钟产生多少？</li><li>废料是暂存还是进一步加工？</li><li>危险物品运输路线是否经过常用基地？</li><li>停机时上游燃料和副产品会不会堵塞？</li></ul><h2>布局建议</h2><p>把核燃料加工、核电站、废料处理与储存区分开规划。放射性物品尽量使用专用物流线路，远离主基地和常用通道。不同燃料路线产生的废料种类不同，不能把铀、钚和后期特殊燃料混为一谈。</p>"}, {"id": "p13", "title": "后期、Tier 9 与终局规划", "group": "后期与优化", "desc": "高阶生产链、外星科技、蓝图与工厂重构", "body": "<h2>后期复杂性</h2><p>后期并不只是机器更多，而是配方输入种类增加、流体与固体互转、副产品链更长，远程运输与电力需求更高。集中式工厂减少重复设施，但增加物流耦合；分布式工厂降低局部复杂度，却提高跨区运输成本。</p><h2>高阶生产链规划</h2><ol><li>从最终项目零件反向拆解前置物品。</li><li>识别共享原料与稀缺资源。</li><li>比较标准与替代配方整条链的成本。</li><li>确定集中式或分布式生产。</li><li>建立独立电力、流体和物流接口。</li><li>用缓冲与状态指示监控关键链路。</li></ol><h2>Somersloop 与生产增幅</h2><p>Somersloop 可用于生产增幅机制。增幅提高产出，但会显著增加功耗并消耗有限地图资源。优先考虑高价值、难以扩产或能明显解除瓶颈的生产环节，而不是无差别使用。</p><h2>终局检查</h2><ul><li>项目零件有独立、稳定的生产线。</li><li>关键资源节点与物流线路有余量。</li><li>电网容量与储能能应对扩产。</li><li>流体副产品有明确出口。</li><li>核废料有专用处理区。</li><li>蓝图、标签和生产文档与实际布局一致。</li></ul>"}, {"id": "p14", "title": "故障排查与常见误区", "group": "后期与优化", "desc": "机器停机、缺料、堵塞、跳闸与产量偏差", "body": "<h2>机器不生产</h2><ul><li>检查通电和待机状态。</li><li>检查配方是否正确、是否解锁。</li><li>检查输入种类和数量。</li><li>检查输出是否堵塞。</li><li>检查流体输入、扬程和输出端。</li></ul><h2>产量低于计算值</h2><ul><li>检查矿机输出。</li><li>检查传送带等级与合流点带宽。</li><li>检查机器是否间歇缺料。</li><li>检查流体管网稳定性。</li><li>检查时钟速度是否变化。</li><li>观察足够长时间，排除缓存填充造成的短时偏差。</li></ul><h2>电网跳闸</h2><ol><li>先恢复关键电力，不要一次启动所有生产线。</li><li>检查最近新增的超频机器与大型建筑。</li><li>检查煤、水、燃料或原油供给。</li><li>检查需求是否超过可用容量。</li><li>分区负载并增加备用容量。</li></ol><h2>越扩越乱</h2><p>当一条线同时承担多个产品、副产品和多个工厂供料时，排错成本会迅速上升。将其拆成标准模块，为每个模块定义输入、输出、容量和故障隔离点。</p>"}, {"id": "p15", "title": "数据库、来源与勘误", "group": "参考资料", "desc": "条目结构、数据可信度、版本更新制度与外部来源", "body": "<h2>数据库原则</h2><p>完整数据库应关联物品、配方、建筑、解锁条件与生产链。物品条目包含用途、堆叠上限、Sink 点数、生产与消耗配方；配方条目包含输入、输出、加工建筑、周期和每分钟速率。</p><h2>为什么不伪造全量明细</h2><p>游戏数据库规模大，配方会随版本变化。没有逐条读取当前版本数据文件或可靠结构化数据库时，手工填满数百条配方会制造大量隐蔽错误。因此本版覆盖主要系统与攻略路径；逐物品、逐配方数据库应从当前版本数据导入并校验。</p><h2>可信度标记</h2><table><tr><th>状态</th><th>含义</th><th>处理方式</th></tr><tr><td>已核验</td><td>与当前版本资料一致</td><td>注明版本后用于规划</td></tr><tr><td>需复核</td><td>机制复杂或版本可能变更</td><td>不作为唯一依据</td></tr><tr><td>社区经验</td><td>布局建议和经验策略</td><td>标注为建议</td></tr><tr><td>待补充</td><td>尚未完成逐项核验</td><td>不编造数值</td></tr></table><h2>主要外部资料</h2><ul><li><a href='https://satisfactory.wiki.gg/' target='_blank'>Official Satisfactory Wiki</a>：机制、建筑、物品、配方与补丁。</li><li><a href='https://satisfactorygame.wiki/' target='_blank'>Satisfactory Game Wiki / Guides</a>：生产链、流体、电力与替代配方指南。</li><li><a href='https://satisfactorybase.com/wiki' target='_blank'>SatisfactoryBase</a>：结构化物品、建筑、配方与解锁数据库。</li><li><a href='https://satisfactory.th.gl/' target='_blank'>互动地图</a>：资源节点、坠毁舱与收集物位置。</li></ul><h2>版本说明</h2><p>本版按 2026-11-08 可查资料，以 v1.2.5.0（Build 517554）为基准。部分第三方配方指南仍可能显示 1.2.4.0 快照，因此涉及配方数值时优先使用当前游戏内数据或已同步数据库。更新时记录条目、旧值、新值、来源和受影响的计算示例。</p>"}];const nav=document.getElementById('nav'),article=document.getElementById('article'),search=document.getElementById('search');function menu(q=''){nav.innerHTML='';let last='';PAGES.forEach(p=>{if(q&&!(`${p.title} ${p.group} ${p.desc}`).toLowerCase().includes(q.toLowerCase()))return;if(last!==p.group){let h=document.createElement('div');h.className='group';h.textContent=p.group;nav.appendChild(h);last=p.group}let a=document.createElement('a');a.href='#'+p.id;a.dataset.id=p.id;a.textContent=p.title;nav.appendChild(a)})}function show(){let id=location.hash.slice(1)||PAGES[0].id,p=PAGES.find(x=>x.id===id)||PAGES[0];article.innerHTML=(p.id==='p0'?`<div class="hero"><div class="k">SATISFACTORY FIELD GUIDE · V1.0</div><h1>幸福工厂<br><em>完全攻略百科</em></h1><p>从第一台矿机到跨区域自动化网络。理解机制、计算产能、规划物流，让工厂可维护、可扩展。</p><div class="tags"><span>版本 1.2.5.0</span><span>核验 2026-11-08</span><span>正式内容版</span></div></div>`:'')+`<h1>${p.title}</h1><p class="desc">${p.desc}</p>${p.body}`;document.getElementById('crumb').textContent='FICSIT FIELD MANUAL / '+p.group.toUpperCase();document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===p.id));window.scrollTo(0,0)}menu();show();window.addEventListener('hashchange',show);search.addEventListener('input',e=>menu(e.target.value.trim()));</script></body></html>
